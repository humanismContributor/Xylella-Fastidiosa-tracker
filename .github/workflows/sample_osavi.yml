name: Sample OSAVI at Field Samples

# Manual only. Saves the summer OSAVI at every tree in Regione Puglia's
# sampling data (campaigns 2013-2025) that falls inside a scan region
# (sample_osavi.py), for offline calibration of the decline rules. Reads the
# scanner's state, never changes it, and commits nothing: the tables are kept
# as a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id from regions.json, or 'all'"
        required: true
        default: "all"

permissions:
  contents: read

# Shares the weekly scan's group, so it never competes with the scan for imagery requests
concurrency:
  group: xylella-scan
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Mambaforge (Geospatial Environment)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: xylella_env
          channels: conda-forge
          python-version: "3.11"

      - name: Install Geospatial Python Packages
        run: |
          mamba install -y numpy scipy xarray dask rasterio pystac-client odc-stac odc-geo planetary-computer openpyxl

      - name: Download the regional sampling data (campaign workbooks 2013-2025)
        run: python calibrate_scanner.py --download

      - name: Extract OSAVI at sampled trees
        run: |
          if [ "${{ inputs.region }}" = "all" ]; then
            python sample_osavi.py --all
          else
            python sample_osavi.py --region "${{ inputs.region }}"
          fi

      # Not committed: each row is a sampled tree's exact position and lab result, and
      # the campaign workbooks state no licence. Download the artifact to run replay_rules.py.
      - name: Keep the tables as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: osavi-tables-${{ inputs.region }}
          path: .cache/osavi/
          retention-days: 90
