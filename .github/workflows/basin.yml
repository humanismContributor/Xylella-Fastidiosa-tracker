name: Annual Basin Screening

# Once a year, after the July-August season it compares, screen the whole
# Mediterranean olive belt (basin.json) at 100 m. The schedule fires every
# Tuesday from September to November: the first runs do the work, later runs
# finish any cells left over and then stop after the plan step (about a minute).
#
# Free-plan sizing: set the repository variables BASIN_BATCHES (parallel jobs,
# max 20) and BASIN_BUDGET_MIN (minutes per job) under Settings > Secrets and
# variables > Actions > Variables. Defaults: 16 jobs x 320 min, for public
# repositories. For a private repository on the 2,000-minute plan, use for
# example 4 jobs x 90 min; the screening then completes over several weeks.

on:
  schedule:
    - cron: '17 3 * 9,10,11 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xylella-basin
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      count: ${{ steps.plan.outputs.count }}
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Get the cell files from the basin-cells branch
        run: |
          mkdir -p data/basin/cells
          if git fetch --depth 1 origin basin-cells; then
            git archive FETCH_HEAD | tar -x -C data/basin/cells
          else
            echo "No basin-cells branch yet: every cell starts fresh."
          fi
      - name: Find cells that still need this season
        id: plan
        run: |
          out=$(python basin_scanner.py --plan "${{ vars.BASIN_BATCHES || 16 }}")
          echo "$out"
          echo "pending=$(echo "$out" | jq -r .pending)" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$out" | jq -r .count)" >> "$GITHUB_OUTPUT"
          echo "batches=$(echo "$out" | jq -c .batches)" >> "$GITHUB_OUTPUT"

  screen:
    needs: plan
    if: ${{ needs.plan.outputs.pending != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # The free plan runs 20 jobs at once; keep 4 free for the weekly scan and tests
      max-parallel: 16
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: xylella_env
          channels: conda-forge
          python-version: "3.11"
      - name: Get the cell files from the basin-cells branch
        run: |
          mkdir -p data/basin/cells
          if git fetch --depth 1 origin basin-cells; then
            git archive FETCH_HEAD | tar -x -C data/basin/cells
          else
            echo "No basin-cells branch yet: every cell starts fresh."
          fi
      - name: Install Geospatial Python Packages
        run: mamba install -y numpy scipy xarray dask rasterio pystac-client odc-stac odc-geo planetary-computer
      - name: Screen batch ${{ matrix.batch }}
        run: |
          python basin_scanner.py --batch ${{ matrix.batch }} --of ${{ needs.plan.outputs.count }} \
            --budget-min "${{ vars.BASIN_BUDGET_MIN || 320 }}" --write-dir basin_out
      - name: Keep finished cells
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basin-${{ matrix.batch }}
          path: basin_out/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [plan, screen]
    if: ${{ !cancelled() && needs.plan.outputs.pending != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Get the cell files from the basin-cells branch
        run: |
          mkdir -p data/basin/cells
          if git fetch --depth 1 origin basin-cells; then
            git archive FETCH_HEAD | tar -x -C data/basin/cells
          else
            echo "No basin-cells branch yet: every cell starts fresh."
          fi
      - name: Collect finished cells
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: basin-*
          path: data/basin/cells
          merge-multiple: true
      - name: Build basin map
        run: python basin_scanner.py --merge
      - name: Save the cell files to the basin-cells branch
        # One commit that replaces the previous one: the cells are working state for the
        # next run, the app never reads them, and keeping every version grew main by ~30 MB.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tmp=$(mktemp -d)
          cp -r data/basin/cells/. "$tmp"/
          cd "$tmp"
          git init -q -b basin-cells
          git config user.name "Automated Satellite Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Basin cell state ($(date -u +%F))"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" basin-cells
      - name: Commit the basin map
        run: |
          set -e
          git config user.name "Automated Satellite Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/basin/hotspots.geojson data/basin/summary.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Sync: basin screening update"
            git pull --rebase origin main
            git push origin main
          fi
